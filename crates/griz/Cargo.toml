[package]
name = "griz"
default-run = "griz"
description = "Code edits as composable primitives: find, plan, diff, apply, undo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/griz"
readme = "../../README.md"
keywords = ["codemod", "refactoring", "mcp", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "griz-engine"
path = "src/engine.rs"

[dependencies]
griz-core.workspace = true
griz-store.workspace = true
incurs.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38.44", features = ["process"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
