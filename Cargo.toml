[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/douglance/griz"

[workspace.dependencies]
anyhow = "1"
diffy = "0.4"
dirs = "6"
ignore = "0.4"
incurs = { version = "0.7.4", features = ["mcp"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2.7"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
uuid = { version = "1", features = ["serde", "v7"] }
griz-core = { path = "crates/griz-core", version = "0.1.0" }
griz-store = { path = "crates/griz-store", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
excessive_nesting = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
