name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify observed batch synchronization
        if: runner.os == 'macOS'
        run: |
          clang -dynamiclib -Wall -Wextra -Werror crates/griz/examples/trace_write_sync.c -o /tmp/griz-sync-observer.dylib
          python3 crates/griz/examples/verify_write_sync.py --binary target/debug/griz --library /tmp/griz-sync-observer.dylib --blob-groups --rename-errors
      - run: cargo xtask check
      - run: cargo publish --dry-run --workspace
